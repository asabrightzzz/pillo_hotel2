services:
  pillo_hotel:
    build:
      context: .
      dockerfile: Dockerfile
    image: pillo_hotel:latest
    container_name: pillo_hotel
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_NAME: "Pillo Hotel"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:-base64:DRZoojn349NKCShTDdXCVvPjuO6HEe1rwECJiNmJiro=}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
    volumes:
      - hotel_data:/app/database
      - hotel_storage:/app/storage/app/public

volumes:
  hotel_data:
  hotel_storage:
