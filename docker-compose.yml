services:
  pillo_hotel:
    build:
      context: .
      dockerfile: Dockerfile
    image: pillo_hotel:latest
    container_name: pillo_hotel
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_NAME: "Pillo Hotel"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:-base64:DRZoojn349NKCShTDdXCVvPjuO6HEe1rwECJiNmJiro=}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      # PostgreSQL configuration (connects to ZimaOS host PostgreSQL)
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-host.docker.internal}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:-pillo_hotel}"
      DB_USERNAME: "${DB_USERNAME:-casaos}"
      DB_PASSWORD: "${DB_PASSWORD:-casaos}"
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
    volumes:
      - hotel_data:/app/database
      - hotel_storage:/app/storage/app/public

volumes:
  hotel_data:
  hotel_storage:
